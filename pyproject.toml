[project]
name = "blastradius"
version = "0.1.0"
description = "PR risk & incident memory engine — know what your PR might break before it merges."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sidmhatre17" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "pydantic-settings>=2.6.0",
    "unidiff>=0.7.5",
    "pyyaml>=6.0.2",
    "python-frontmatter>=1.1.0",
    "httpx>=0.28.0",
    "chromadb>=0.5.23",
    "sentence-transformers>=3.3.0",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blastradius"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "apps", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
